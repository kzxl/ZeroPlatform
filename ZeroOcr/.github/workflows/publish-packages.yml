name: Publish NuGet Packages (GitHub & NuGet.org)

on:
  release:
    types: [published]
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # Required for NuGet.org Trusted Publishing (OIDC)

jobs:
  publish:
    name: Build, Test & Publish ZeroOcr Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          source-url: https://nuget.pkg.github.com/kzxl/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: dotnet test tests/ZeroOcr.Tests/ZeroOcr.Tests.csproj -c Release --verbosity normal

      - name: Pack ZeroOcr.Core
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet pack src/ZeroOcr.Core/ZeroOcr.Core.csproj -c Release -o nupkgs

      - name: Pack ZeroOcr.Inference
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet pack src/ZeroOcr.Inference/ZeroOcr.Inference.csproj -c Release -o nupkgs

      - name: Pack ZeroOcr.Windows
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet pack src/ZeroOcr.Windows/ZeroOcr.Windows.csproj -c Release -o nupkgs

      # 1. Push to GitHub Packages
      - name: Push to GitHub Packages
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Get-ChildItem -Path nupkgs -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name) to GitHub Packages..."
            dotnet nuget push $_.FullName --source "https://nuget.pkg.github.com/kzxl/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }

      # 2. NuGet.org Login (OIDC Trusted Publishing)
      - name: NuGet.org Login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: ${{ secrets.NUGET_USER || 'kzxl' }}

      # 3. Push to NuGet.org (Trusted Publishing or API Key fallback)
      - name: Push to NuGet.org
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY != '' && steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if (-not $env:NUGET_KEY) {
            Write-Warning "Skipping push to NuGet.org: neither OIDC token nor NUGET_API_KEY secret is available."
            exit 0
          }
          Get-ChildItem -Path nupkgs -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name) to NuGet.org..."
            dotnet nuget push $_.FullName --source "https://api.nuget.org/v3/index.json" --api-key $env:NUGET_KEY --skip-duplicate
          }
