name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and Publish to NuGet
    runs-on: windows-latest
    if: github.repository == 'kzxl/ZeroPlatform'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore ZeroPlatform.slnx

      - name: Build Solution (Release)
        run: dotnet build ZeroPlatform.slnx -c Release --no-restore

      - name: Run Integration Tests
        run: dotnet test tests/ZeroPlatform.Tests.Integration/ZeroPlatform.Tests.Integration.csproj -c Release --no-build

      - name: Pack All Subsystems
        run: dotnet pack ZeroPlatform.slnx -c Release --no-build -o ./nupkgs

      - name: NuGet Login (Trusted Publishing OIDC)
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: kzxl

      - name: Push Packages to NuGet.org
        run: |
          $apiKey = "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if (-not $apiKey -or $apiKey.Trim() -eq "") {
            $apiKey = "${{ secrets.NUGET_API_KEY }}"
          }
          if (-not $apiKey -or $apiKey.Trim() -eq "") {
            Write-Error "No valid NuGet credentials found. Please configure NuGet Trusted Publishing for kzxl/ZeroPlatform or provide NUGET_API_KEY secret."
            exit 1
          }
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          Write-Host "Found $($packages.Count) packages to push."
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $apiKey --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
        shell: pwsh
