name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'
      - 'primitives-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Release target (primitives or platform)'
        required: true
        type: choice
        default: primitives
        options:
          - primitives
          - platform
      skip_primitives_nuget_check:
        description: 'Skip checking whether ZeroPrimitives.Core version is already published on NuGet.org (platform target only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-primitives:
    name: Build, Test, Pack & Publish ZeroPrimitives.Core
    runs-on: windows-latest
    if: github.repository == 'kzxl/ZeroPlatform' && (startsWith(github.ref, 'refs/tags/primitives-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'primitives'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Validate Version Consistency
        shell: pwsh
        run: |
          $propsPath = "ZeroPrimitives/Directory.Build.props"
          $propsContent = Get-Content -Path $propsPath -Raw
          if ($propsContent -notmatch "<VersionPrefix\s+Condition=""'\$\(VersionPrefix\)' == ''"">([^<]+)</VersionPrefix>") {
            Write-Error "Could not locate default <VersionPrefix> in $propsPath."
            exit 1
          }
          $versionPrefix = $Matches[1].Trim()
          Write-Host "Configured ZeroPrimitives VersionPrefix: $versionPrefix"

          if ("${{ github.ref_type }}" -eq "tag") {
            $tagName = "${{ github.ref_name }}"
            $tagVersion = $tagName -replace '^primitives-v', ''
            if ($tagVersion -eq $versionPrefix) {
              Write-Host "Tag $tagName matches VersionPrefix $versionPrefix."
            } elseif ($tagVersion -like "$versionPrefix-*") {
              $suffix = $tagVersion.Substring($versionPrefix.Length + 1)
              if ([string]::IsNullOrWhiteSpace($suffix)) {
                Write-Error "Invalid prerelease tag '$tagName'."
                exit 1
              }
              Write-Host "Tag $tagName matches VersionPrefix $versionPrefix with prerelease suffix '$suffix'."
              "VERSION_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Error "Tag '$tagName' ($tagVersion) does not match VersionPrefix '$versionPrefix' in $propsPath."
              exit 1
            }
          }

      - name: Restore ZeroPrimitives
        run: dotnet restore ZeroPrimitives/ZeroPrimitives.slnx

      - name: Build ZeroPrimitives (Release)
        shell: pwsh
        run: |
          $buildArgs = @('build', 'ZeroPrimitives/ZeroPrimitives.slnx', '-c', 'Release', '--no-restore')
          if ($env:VERSION_SUFFIX -and $env:VERSION_SUFFIX.Trim() -ne '') {
            $buildArgs += "-p:VersionSuffix=$($env:VERSION_SUFFIX.Trim())"
          }
          & dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run ZeroPrimitives Tests (net8.0 & net462)
        run: dotnet test ZeroPrimitives/tests/ZeroPrimitives.Tests/ZeroPrimitives.Tests.csproj -c Release --no-build

      - name: Pack ZeroPrimitives.Core
        shell: pwsh
        run: |
          $packArgs = @(
            'pack',
            'ZeroPrimitives/src/ZeroPrimitives.Core/ZeroPrimitives.Core.csproj',
            '-c', 'Release',
            '--no-build',
            '-o', './nupkgs-primitives'
          )
          if ($env:VERSION_SUFFIX -and $env:VERSION_SUFFIX.Trim() -ne '') {
            $packArgs += "-p:VersionSuffix=$($env:VERSION_SUFFIX.Trim())"
          }
          & dotnet @packArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Package Metadata & Tier-0A Independence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem -Path ./nupkgs-primitives -Filter 'ZeroPrimitives.Core.*.nupkg' | Select-Object -First 1
          if (-not $nupkg) {
            Write-Error "ZeroPrimitives.Core nupkg was not generated."
            exit 1
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
            if (-not $entry) {
              Write-Error "Missing .nuspec in $($nupkg.Name)"
              exit 1
            }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try {
              [xml]$nuspec = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
            $pkgId = $nuspec.package.metadata.id
            if ($pkgId -ne 'ZeroPrimitives.Core') {
              Write-Error "Unexpected PackageId '$pkgId' (expected 'ZeroPrimitives.Core')."
              exit 1
            }
            $zeroDeps = @($nuspec.package.metadata.dependencies.group.dependency | Where-Object { $_.id -like 'Zero*' })
            if ($zeroDeps.Count -gt 0) {
              $names = ($zeroDeps | ForEach-Object { $_.id }) -join ', '
              Write-Error "Tier-0A invariant violated: ZeroPrimitives.Core has internal Zero* dependencies: $names"
              exit 1
            }
            Write-Host "Verified $($nupkg.Name) (id=$pkgId, version=$($nuspec.package.metadata.version), Zero* deps=0)."
          } finally {
            $zip.Dispose()
          }

      - name: NuGet Login (Trusted Publishing OIDC)
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: kzxl

      - name: Push ZeroPrimitives.Core to NuGet.org
        shell: pwsh
        run: |
          $apiKey = "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if (-not $apiKey -or $apiKey.Trim() -eq "") {
            $apiKey = "${{ secrets.NUGET_API_KEY }}"
          }
          if (-not $apiKey -or $apiKey.Trim() -eq "") {
            Write-Error "No valid NuGet credentials found. Please configure NuGet Trusted Publishing for kzxl/ZeroPlatform or provide NUGET_API_KEY secret."
            exit 1
          }
          $packages = Get-ChildItem -Path ./nupkgs-primitives -Filter 'ZeroPrimitives.Core.*.nupkg'
          if ($packages.Count -eq 0) {
            Write-Error "No ZeroPrimitives.Core package found to push."
            exit 1
          }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $apiKey --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  publish-platform:
    name: Pack and Publish ZeroPlatform to NuGet
    runs-on: windows-latest
    if: github.repository == 'kzxl/ZeroPlatform' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'platform'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore ZeroPlatform.slnx

      - name: Build Solution (Release)
        run: dotnet build ZeroPlatform.slnx -c Release --no-restore

      - name: Run Integration Tests
        run: dotnet test tests/ZeroPlatform.Tests.Integration/ZeroPlatform.Tests.Integration.csproj -c Release --no-build

      - name: Verify ZeroPrimitives.Core Published on NuGet.org
        if: ${{ !inputs.skip_primitives_nuget_check }}
        shell: pwsh
        run: |
          $propsPath = "ZeroPrimitives/Directory.Build.props"
          $propsContent = Get-Content -Path $propsPath -Raw
          if ($propsContent -notmatch "<VersionPrefix\s+Condition=""'\$\(VersionPrefix\)' == ''"">([^<]+)</VersionPrefix>") {
            Write-Error "Could not locate default <VersionPrefix> in $propsPath."
            exit 1
          }
          $expectedVersion = $Matches[1].Trim().ToLowerInvariant()
          $indexUrl = "https://api.nuget.org/v3-flatcontainer/zeroprimitives.core/index.json"
          Write-Host "Checking NuGet.org for ZeroPrimitives.Core $expectedVersion..."
          $indexJson = Invoke-RestMethod -Uri $indexUrl -Method Get
          if ($indexJson.versions -notcontains $expectedVersion) {
            Write-Error "ZeroPrimitives.Core $expectedVersion is not yet published on NuGet.org. Tag and publish 'primitives-v$expectedVersion' first before publishing ZeroPlatform."
            exit 1
          }
          Write-Host "Verified: ZeroPrimitives.Core $expectedVersion is already published on NuGet.org."

      - name: Pack All Subsystems
        run: dotnet pack ZeroPlatform.slnx -c Release --no-build -o ./nupkgs

      - name: NuGet Login (Trusted Publishing OIDC)
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: kzxl

      - name: Push Packages to NuGet.org
        run: |
          $apiKey = "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if (-not $apiKey -or $apiKey.Trim() -eq "") {
            $apiKey = "${{ secrets.NUGET_API_KEY }}"
          }
          if (-not $apiKey -or $apiKey.Trim() -eq "") {
            Write-Error "No valid NuGet credentials found. Please configure NuGet Trusted Publishing for kzxl/ZeroPlatform or provide NUGET_API_KEY secret."
            exit 1
          }
          Write-Host "Excluding ZeroPrimitives.Core (published independently via publish-primitives job on primitives-v* tags)."
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg | Where-Object { $_.Name -notlike 'ZeroPrimitives.Core.*.nupkg' }
          Write-Host "Found $($packages.Count) packages to push."
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $apiKey --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
        shell: pwsh
