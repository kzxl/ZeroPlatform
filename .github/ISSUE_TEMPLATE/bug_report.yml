name: 🐛 Bug Report
description: Report a bug or exception across any ZeroPlatform subsystem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in ZeroPlatform! Please provide enough details so the team can reproduce and resolve it.
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which ZeroPlatform subsystem is affected?
      options:
        - ZeroPrimitives (Memory, Span/Pointer, CRC32C)
        - ZeroTensor (Strided N-D Tensor, Linear Algebra)
        - ZeroCompute (Direct3D 11 Compute Shader, SIMD)
        - ZeroData (DataFrame, Hash Joins, Arrow IPC)
        - ZeroStorage (TSDB, Gorilla Compression, WAL)
        - ZeroInference (ONNX Parser, Graph Runtime, NMS)
        - ZeroNeural (Autograd, Neural Layers, Optimizers)
        - ZeroSignal (FFT, STFT, Filter, Kalman)
        - ZeroGeometry (ICP, KdTree, Delaunay)
        - ZeroComm (Modbus, MC Protocol 3E, FINS)
        - ZeroGraphics (Direct3D 11, HDR, Metrology)
        - ZeroUI (SCADA Controls, Virtual Grid, Dark Theme)
        - ZeroPipeline (DAG Scheduler, Canvas)
        - ZeroNetwork (HTTP Server, Scanner, Packet Parser)
        - ZeroDocuments (Excel .xlsx, CSV Engine)
        - Core / Orchestrator / Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or steps to reproduce the issue.
      placeholder: |
        1. Initialize subsystem with ...
        2. Call method ...
        3. See exception
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Stack Trace / Error Logs
      render: shell
